services:
  # 1. SQL Server - Database for TripService
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: swiftride-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Password123!" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. MongoDB - Database for MatchingService
  mongodb:
    image: mongo:7.0
    container_name: swiftride-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: MatchDB
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. PostgreSQL - Database for PaymentService
  postgres:
    image: postgres:17-alpine
    container_name: swiftride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: PayDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -d PayDB
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. RabbitMQ - Message Broker with Management Web UI
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftride-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sqlserver_data:
  mongodb_data:
  postgres_data:
  rabbitmq_data:
