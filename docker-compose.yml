services:
  # 1. SQL Server - Database for TripService
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: swiftride-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD:-Password123!}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. MongoDB - Database for MatchingService
  mongodb:
    image: mongo:7.0
    container_name: swiftride-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: MatchDB
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. PostgreSQL - Database for PaymentService
  postgres:
    image: postgres:17-alpine
    container_name: swiftride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PayDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-PayDB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. RabbitMQ - Message Broker with Management Web UI
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftride-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 5. Trip Service
  trip-service:
    build:
      context: .
      dockerfile: src/TripService/Dockerfile
    container_name: swiftride-trip-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TripDbConnection: "Server=sqlserver,1433;Database=TripDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672"
    ports:
      - "5105:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 6. Matching Service
  matching-service:
    build:
      context: .
      dockerfile: src/MatchingService/Dockerfile
    container_name: swiftride-matching-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MongoDbConnection: "mongodb://mongodb:27017"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672"
    ports:
      - "5248:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 7. Payment Service
  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    container_name: swiftride-payment-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentDbConnection: "Host=postgres;Port=5432;Database=PayDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespassword}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672"
    ports:
      - "5114:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 8. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: swiftride-api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "${SWIFTRIDE_JWT_SECRET:-SwiftRide-JWT-Secret-Key-2026-SuperSecure-256Bits!}"
      ReverseProxy__Clusters__trip-cluster__Destinations__destination1__Address: "http://trip-service:8080"
      ReverseProxy__Clusters__matching-cluster__Destinations__destination1__Address: "http://matching-service:8080"
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: "http://payment-service:8080"
      Downstream__TripService: "http://trip-service:8080"
      Downstream__MatchingService: "http://matching-service:8080"
    ports:
      - "5000:8080"
    depends_on:
      - trip-service
      - matching-service
      - payment-service

volumes:
  sqlserver_data:
  mongodb_data:
  postgres_data:
  rabbitmq_data:
